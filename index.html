<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>The Story of Thehreem ✦</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600&family=Parisienne&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    background:#f7edf1;
    color:#4c3944;
    font-family:"Cormorant Garamond",serif;
    overflow-x:hidden;
}

/* COLORS
   dusty rose: #c993a8
   lavender: #b7a8c9

/* ---------- INTRO ---------- */

.intro{
    position:fixed;
    inset:0;
    z-index:9999;

    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;

    background:
        radial-gradient(circle at 50% 40%,#d8b9ca,#9f829d 35%,#604d60 100%);

    transition:1s ease;
}

.intro.hide{
    opacity:0;
    pointer-events:none;
}

.intro-box{
    width:min(700px,90%);
    padding:40px;
    color:white;
}

.intro-small{
    letter-spacing:5px;
    text-transform:uppercase;
    font-size:13px;
    margin-bottom:25px;
    opacity:.8;
}

.intro h1{
    font-family:"Playfair Display",serif;
    font-weight:400;
    font-size:clamp(45px,8vw,85px);
    line-height:1.05;
}

.intro p{
    margin:25px auto 40px;
    max-width:550px;
    font-size:21px;
    font-style:italic;
    opacity:.9;
}

.open-btn{
    padding:15px 32px;
    border:1px solid rgba(255,255,255,.7);
    background:rgba(255,255,255,.12);
    color:white;
    font-family:inherit;
    font-size:16px;
    letter-spacing:3px;
    cursor:pointer;
    transition:.3s;
}

.open-btn:hover{
    background:#fffaf5;
    color:#654c5e;
    transform:translateY(-3px);
}


/* ---------- FLOATING PETALS ---------- */

.petal{
    position:fixed;
    top:-30px;
    z-index:1;
    pointer-events:none;
    font-size:18px;
    opacity:.45;
    animation:fall linear infinite;
}

@keyframes fall{

    0%{
        transform:translateY(-40px) rotate(0deg);
    }

    100%{
        transform:translateY(110vh) rotate(360deg);
    }

}


/* ---------- HERO ---------- */

.hero{
    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    padding:30px;

    background:
        radial-gradient(circle at 20% 20%,rgba(201,147,168,.28),transparent 30%),
        radial-gradient(circle at 80% 70%,rgba(183,168,201,.35),transparent 35%),
        #f7edf1;

    position:relative;
}

.hero-content{
    text-align:center;
    max-width:900px;
    position:relative;
    z-index:3;
}

.ornament{
    color:#c29f58;
    font-size:28px;
    letter-spacing:10px;
}

.hero h1{
    font-family:"Playfair Display",serif;
    font-size:clamp(55px,10vw,110px);
    font-weight:400;
    color:#654c5e;
    margin:20px 0 5px;
}

.hero h2{
    font-family:"Parisienne",cursive;
    color:#bd819b;
    font-size:clamp(50px,8vw,80px);
    font-weight:400;
}

.hero-line{
    width:100px;
    height:1px;
    background:#d5b978;
    margin:30px auto;
}

.hero p{
    font-size:21px;
    color:#806c79;
    font-style:italic;
}

.scroll{
    margin-top:60px;
    font-size:13px;
    letter-spacing:4px;
    color:#a08391;
    animation:bounce 1.8s infinite;
}

@keyframes bounce{
    50%{
        transform:translateY(8px);
    }
}


/* ---------- NOVEL PAGE ---------- */

.page{
    min-height:100vh;
    padding:110px 20px;

    display:flex;
    justify-content:center;
    align-items:center;

    position:relative;
}

.paper{
    width:min(850px,94vw);

    padding:80px 70px;

    background:
        linear-gradient(90deg,
        rgba(120,80,100,.04) 1px,
        transparent 1px),
        #fffaf5;

    background-size:45px 100%;

    border:1px solid rgba(190,145,165,.4);

    box-shadow:
        0 30px 80px rgba(101,76,94,.18),
        inset 0 0 60px rgba(205,180,150,.12);

    position:relative;

    transition:.5s;
}

.paper:hover{
    transform:translateY(-5px);
}

.paper:before{
    content:"";
    position:absolute;
    inset:18px;
    border:1px solid rgba(194,159,88,.35);
    pointer-events:none;
}

.chapter{
    text-align:center;
    position:relative;
    z-index:2;
}

.chapter-number{
    color:#bd819b;
    font-size:13px;
    letter-spacing:5px;
    text-transform:uppercase;
    margin-bottom:20px;
}

.chapter h2{
    font-family:"Playfair Display",serif;
    font-weight:400;
    color:#654c5e;
    font-size:clamp(35px,6vw,55px);
    margin-bottom:30px;
}

.chapter p{
    max-width:650px;
    margin:auto;

    font-size:21px;
    line-height:1.75;

    color:#695866;
}

.dropcap:first-letter{
    font-size:70px;
    float:left;
    line-height:.7;
    padding-right:8px;
    color:#bd819b;
}

.quote{
    max-width:600px;
    margin:40px auto 0;

    padding:25px;

    border-left:2px solid #d5b978;

    background:rgba(201,147,168,.07);

    color:#806c79;

    font-size:22px;
    font-style:italic;
}


/* ---------- CHAPTER CARDS ---------- */

.dark-page{
    background:
        linear-gradient(135deg,#ead9e4,#f6e9ed,#e0d8eb);
}

.story-card{
    width:min(900px,92vw);
    padding:70px;

    background:rgba(255,250,245,.72);

    border:1px solid rgba(151,119,143,.25);

    box-shadow:0 25px 80px rgba(101,76,94,.15);

    text-align:center;
    backdrop-filter:blur(5px);

    position:relative;
}

.story-card h2{
    font-family:"Playfair Display",serif;
    font-weight:400;
    color:#654c5e;
    font-size:clamp(40px,7vw,65px);
    margin:20px 0 30px;
}

.story-card p{
    color:#695866;
    font-size:21px;
    line-height:1.75;
}

.highlight{
    color:#bd819b;
}

.free-time{
    display:inline-block;

    margin-top:35px;

    padding:15px 25px;

    border:1px dashed #bd819b;

    color:#806c79;

    font-family:monospace;

    background:#fffaf5;
}


/* ---------- READER CHAPTER ---------- */

.reader{
    margin-top:35px;
    font-family:"Parisienne",cursive;
    font-size:43px;
    color:#bd819b;
}

.one-more{
    margin-top:35px;
    color:#c29f58;
    font-style:italic;
    font-size:24px;
}


/* ---------- SECRET ---------- */

.secret{
    min-height:100vh;

    display:flex;
    align-items:center;
    justify-content:center;

    text-align:center;

    padding:60px 20px;

    background:#654c5e;

    color:#fffaf5;

    position:relative;
}

.secret-content{
    max-width:700px;
}

.secret-symbol{
    width:85px;
    height:85px;

    margin:auto;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:50%;

    border:1px solid #d5b978;

    color:#d5b978;

    font-size:30px;

    cursor:pointer;

    transition:.5s;

    animation:glow 2s infinite;
}

.secret-symbol:hover{
    transform:rotate(90deg) scale(1.1);
    background:rgba(213,185,120,.1);
}

@keyframes glow{
    50%{
        box-shadow:0 0 35px rgba(213,185,120,.25);
    }
}

.secret h2{
    font-family:"Playfair Display",serif;
    font-size:50px;
    font-weight:400;
    margin:30px 0 20px;
}

.secret-intro{
    font-size:20px;
    color:#dbcfd8;
}

.hidden{
    max-height:0;
    overflow:hidden;
    opacity:0;

    transition:1.2s ease;
}

.hidden.show{
    max-height:500px;
    opacity:1;
    margin-top:40px;
}

.hidden .special{
    font-family:"Parisienne",cursive;
    color:#e2c985;
    font-size:42px;
    margin-bottom:20px;
}

.hidden p{
    color:#e0d6de;
    font-size:20px;
    line-height:1.7;
}


/* ---------- BIRTHDAY ---------- */

.birthday{
    min-height:100vh;

    display:flex;
    align-items:center;
    justify-content:center;

    text-align:center;

    padding:40px;

    position:relative;

    overflow:hidden;

    background:
        radial-gradient(circle at center,#f9edf3,#ead7e3 50%,#d3c5dc);
}

.birthday-content{
    position:relative;
    z-index:5;
}

.birthday-small{
    letter-spacing:6px;
    font-size:13px;
    color:#987a8d;
}

.birthday h1{
    font-family:"Playfair Display",serif;
    font-weight:400;
    font-size:clamp(50px,9vw,100px);
    color:#654c5e;
    margin:25px 0 0;
}

.birthday h2{
    font-family:"Parisienne",cursive;
    font-weight:400;
    font-size:clamp(55px,9vw,90px);
    color:#bd819b;
}

.birthday p{
    margin-top:25px;
    color:#806c79;
    font-size:21px;
}


/* ---------- FIREWORKS ---------- */

.firework{
    position:absolute;
    width:6px;
    height:6px;
    border-radius:50%;
    background:#d5b978;

    animation:explode 2.5s infinite;
}

.firework:nth-child(1){
    left:12%;
    top:25%;
}

.firework:nth-child(2){
    right:15%;
    top:20%;
    animation-delay:.7s;
}

.firework:nth-child(3){
    left:22%;
    bottom:20%;
    animation-delay:1.2s;
}

.firework:nth-child(4){
    right:25%;
    bottom:25%;
    animation-delay:1.8s;
}
